[build]
  base = "/"
  command = "bun run build"
  publish = "apps/web/.next"
  SECRETS_SCAN_ENABLED = false
  SECRETS_SCAN_OMIT_KEYS = ["NODE_ENV", "NEXT_PUBLIC_SITE_URL", "CONTACT_TO_EMAIL", "CONTACT_FROM_EMAIL"]

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  BUN_VERSION = "1.3.14"
  NEXT_PUBLIC_SITE_URL = "https://abhimanyu.qzz.io"
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "NODE_ENV,NEXT_PUBLIC_SITE_URL,CONTACT_TO_EMAIL,CONTACT_FROM_EMAIL"
